<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steam Sale Alert</title>
<meta name="description" content="Steam 스토어 진행 중 할인 목록. 가격·평점·리뷰 수로 필터링.">
<meta name="theme-color" content="#1b2838">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steam Sale">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">STEAM</span><span class="brand-mark-alt">SALE ALERT</span>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="stamp" id="stamp"></div>
</header>

<div class="filters" id="filters">
  <div class="filters-head">
    <button id="filterToggle" type="button" class="filter-toggle" aria-expanded="false" aria-controls="filtersBody">
      <span class="ft-label">필터</span>
      <span class="ft-summary" id="filterSummary">전체</span>
      <span class="ft-caret" aria-hidden="true">▾</span>
    </button>
    <span class="ft-count" id="countMini"></span>
  </div>

  <div class="filters-body" id="filtersBody">
  <div class="filters-inner">

    <div class="row">
      <div class="field grow">
        <label for="q">이름 검색</label>
        <input id="q" type="search" placeholder="게임 이름 일부 입력" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="field">
        <label for="sort">정렬</label>
        <select id="sort">
          <option value="price-asc">가격 낮은순</option>
          <option value="price-desc">가격 높은순</option>
          <option value="discount-desc">할인율 높은순</option>
          <option value="rating-desc">평점 높은순</option>
          <option value="reviews-desc">리뷰 많은순</option>
          <option value="name-asc">이름순</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field grow">
        <label for="price">가격대 <output id="priceOut"></output></label>
        <input id="price" type="range" min="0" max="200" step="5" value="200">
      </div>
      <div class="field grow">
        <label for="discount">최소 할인율 <output id="discountOut"></output></label>
        <input id="discount" type="range" min="0" max="90" step="5" value="0">
      </div>
    </div>

    <div class="row">
      <div class="field grow">
        <label for="rating">최소 평점 <output id="ratingOut"></output></label>
        <input id="rating" type="range" min="0" max="100" step="1" value="0">
      </div>
      <div class="field grow">
        <label for="reviews">최소 리뷰 수</label>
        <select id="reviews">
          <option value="0">전체</option>
          <option value="500">500+</option>
          <option value="1000">1,000+</option>
          <option value="5000">5,000+</option>
          <option value="10000">10,000+</option>
          <option value="50000">50,000+</option>
          <option value="100000">100,000+</option>
        </select>
      </div>
    </div>

    <div class="row row-last">
      <label class="check">
        <input id="hideSeen" type="checkbox">
        <span>이미 본 게임 숨기기</span>
      </label>
      <div class="spacer"></div>
      <button id="reset" type="button" class="ghost">필터 초기화</button>
    </div>

  </div>
  </div>
</div>

<main>
  <div class="result-bar">
    <span id="count"></span>
    <button id="more" type="button" hidden>더 보기</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="sentinel"></div>
  <p id="empty" class="empty" hidden>조건에 맞는 게임이 없습니다.</p>
</main>

<footer class="foot">
  <p>가격과 할인율은 수집 시점 기준이며 실제 Steam 가격과 다를 수 있습니다. 최종 가격은 Steam 상점 구매 페이지에서 확인하세요.</p>
  <p class="foot-sub" id="footSub"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
